name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  after-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: after
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: after/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'

  before-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: before
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: before/package-lock.json
      - run: npm ci
      - run: npm run build
